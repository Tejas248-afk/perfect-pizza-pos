<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Report - Perfect Pizza</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #334155; margin: 0; }

    .pos-header {
      background: #1e293b; color: #fff; padding: 14px 22px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pos-header h2 { margin: 0; font-size: 20px; }
    .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-links a, .nav-links button {
      background: #334155; color: #fff; border: none; text-decoration: none;
      padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    .btn-pos { background: #22c55e !important; }
    .btn-logout { background: #ef4444 !important; }

    .container { max-width: 1300px; margin: 0 auto; padding: 20px; }

    .filter-card {
      background: #fff; border-radius: 10px; padding: 18px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px;
      border-top: 4px solid #14b8a6;
    }
    .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .btn-preset {
      border: 1px solid #cbd5e1; background: #f8fafc; color: #475569;
      padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .btn-preset.active, .btn-preset:hover { background: #14b8a6; color: #fff; border-color: #14b8a6; }

    .date-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; font-weight: 600; color: #64748b; }
    .field input {
      padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;
    }
    .btn-apply {
      background: #22c55e; color: #fff; border: none; padding: 10px 18px;
      border-radius: 6px; font-weight: 600; cursor: pointer;
    }
    .btn-reset {
      background: #fff; border: 1px solid #cbd5e1; color: #334155;
      padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer;
    }

    .kpi-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px;
    }
    @media (max-width: 900px) { .kpi-row { grid-template-columns: 1fr 1fr; } }
    .kpi {
      background: #fff; border-radius: 10px; padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .kpi .t { font-size: 12px; color: #64748b; font-weight: 600; }
    .kpi .v { font-size: 22px; font-weight: 700; margin-top: 6px; }
    .kpi.green .v { color: #16a34a; }
    .kpi.blue .v { color: #2563eb; }
    .kpi.orange .v { color: #d97706; }
    .kpi.red .v { color: #dc2626; }

    .table-card {
      background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .table-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid #e2e8f0; gap: 10px; flex-wrap: wrap;
    }
    .table-top input {
      padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; width: 220px;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 950px; }
    th, td {
      padding: 13px 12px; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #f1f5f9;
      text-align: left; font-size: 13px;
    }
    th { background: #f8fafc; color: #475569; font-weight: 700; }
    .badge {
      background: #22c55e; color: #fff; padding: 3px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
    }
    .c-orange { color: #d97706; font-weight: 600; }
    .c-red { color: #dc2626; font-weight: 600; }
    .c-blue { color: #2563eb; font-weight: 600; }
    tfoot td { background: #f1f5f9; font-weight: 700; }
    .empty { text-align: center; padding: 40px; color: #64748b; }
    .err { color: #dc2626; font-weight: 600; }

    @media print {
      .pos-header, .filter-card, .table-top, .kpi-row { display: none !important; }
      body { background: #fff; }
      .container { padding: 0; }
    }
  </style>
</head>
<body>
  <header class="pos-header">
    <h2>📊 Sales Report</h2>
    <div class="nav-links">
      <a href="orders.html">📋 Live Orders</a>
      <a href="pos.html" class="btn-pos">← POS</a>
      <button onclick="logout()" class="btn-logout">Logout</button>
    </div>
  </header>

  <div class="container">
    <!-- Filters -->
    <div class="filter-card">
      <div class="preset-row">
        <button class="btn-preset active" data-range="today" onclick="setRange('today', this)">Today</button>
        <button class="btn-preset" data-range="yesterday" onclick="setRange('yesterday', this)">Yesterday</button>
        <button class="btn-preset" data-range="week" onclick="setRange('week', this)">This Week</button>
        <button class="btn-preset" data-range="month" onclick="setRange('month', this)">This Month</button>
        <button class="btn-preset" data-range="all" onclick="setRange('all', this)">All Time</button>
      </div>
      <div class="date-row">
        <div class="field">
          <label>From</label>
          <input type="date" id="startDate">
        </div>
        <div class="field">
          <label>To</label>
          <input type="date" id="endDate">
        </div>
        <button class="btn-apply" onclick="loadReport()">✔ Apply</button>
        <button class="btn-reset" onclick="setRange('today')">Reset</button>
        <button class="btn-reset" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
      </div>
    </div>

    <!-- KPI -->
    <div class="kpi-row">
      <div class="kpi green">
        <div class="t">NET SALES</div>
        <div class="v" id="kpiNet">₹0</div>
      </div>
      <div class="kpi blue">
        <div class="t">ORDERS</div>
        <div class="v" id="kpiOrders">0</div>
      </div>
      <div class="kpi orange">
        <div class="t">TAX (GST)</div>
        <div class="v" id="kpiTax">₹0</div>
      </div>
      <div class="kpi red">
        <div class="t">CANCELLED / RETURNS</div>
        <div class="v" id="kpiCancel">₹0</div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-top">
        <strong>Daily Sales Summary</strong>
        <input type="text" id="searchBox" placeholder="Search date..." oninput="filterRows()">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Period</th>
              <th>Orders</th>
              <th>Sub Total</th>
              <th>Discounts</th>
              <th>Tax</th>
              <th>Charges</th>
              <th>Gross Sales</th>
              <th>Returns</th>
              <th>Net Sales</th>
            </tr>
          </thead>
          <tbody id="reportBody">
            <tr><td colspan="9" class="empty">Loading...</td></tr>
          </tbody>
          <tfoot id="reportFoot" style="display:none;"></tfoot>
        </table>
      </div>
    </div>
  </div>

  <script src="js/reports.js"></script>
</body>
</html>
