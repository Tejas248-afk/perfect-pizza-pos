<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Perfect Pizza POS</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="brand-header">
      <img src="images/logo.png" alt="Perfect Pizza" class="login-logo" style="width: 220px; height: auto; display: block; margin: 0 auto 16px;">
      <h1>Perfect Pizza</h1>
      <p>POS & Management System</p>
    </div>

    <form id="loginForm">
      <div id="alertBox" class="alert hidden"></div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input 
          type="text" 
          id="phone" 
          placeholder="Enter phone number" 
          value="9889229198"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter password" 
          value="admin123"
          required
        >
      </div>

      <button type="submit" id="loginBtn" class="btn-primary">
        Login to POS
      </button>
    </form>

    <div class="footer-tag">
      100% Pure Mozzarella's Pizza
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
